spring.application.name=ms-pedidos
server.port=8082

# Conexión MySQL con credenciales correctas y permiso de clave pública
spring.datasource.url=jdbc:mysql://localhost:3306/db_smartlogix_pedidos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

ms.inventario.base-url=http://localhost:8081
